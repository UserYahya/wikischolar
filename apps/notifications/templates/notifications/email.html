{% autoescape on %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
{# Layout for every WikiScholar email (apps/notifications/html_email.py). Inline styles and tables only: mail apps ignore <style> and modern CSS. #}
<body style="margin:0;padding:0;background:#F6F7F4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F7F4;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border:1px solid #D6DCD7;border-top:5px solid #0A6B4B;border-radius:8px;">
      <tr><td style="padding:22px 28px 14px;border-bottom:1px solid #E8ECE9;">
        {% if logo_url %}<img src="{{ logo_url }}" width="180" height="56" alt="WikiScholar" style="display:block;width:180px;height:auto;border:0;">
        {% else %}<span style="font:700 24px/1 Arial,sans-serif;color:#0B4F95;">Wiki<span style="color:#0D2A4A;">Scholar</span></span>{% endif %}
      </td></tr>
      <tr><td style="padding:24px 28px 8px;font:16px/1.6 -apple-system,'Segoe UI',Roboto,'Noto Sans Bengali',Arial,sans-serif;color:#1C2521;">
        {{ content|safe }}
      </td></tr>
      <tr><td style="padding:16px 28px 22px;border-top:1px solid #E8ECE9;font:13px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#56635C;">
        WikiScholar &middot; A Wikimedia Bangladesh programme<br>
        <a href="{{ site_url }}" style="color:#0A6B4B;">{{ site_host }}</a> &middot; <a href="mailto:{{ contact_email }}" style="color:#0A6B4B;">{{ contact_email }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>{% endautoescape %}

# Local / staging stack. For production, put a TLS-terminating proxy in front
# and use managed PostgreSQL backups.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-wikischolar}
      POSTGRES_USER: ${DB_USER:-wikischolar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wikischolar}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_reference &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    ports: ["8000:8000"]
  worker:
    # Sends queued bulk messages for batches larger than WS_INLINE_DISPATCH_MAX.
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on: [web]
    command: sh -c "while true; do python manage.py send_queued; sleep 60; done"
volumes:
  pgdata:

{# Analytics for the public pages (public_base.html only, never the dashboard). Each tag is off while its ID #}
{# is empty: WS_CLARITY_ID, WS_META_PIXEL_ID. No form data or contact details are ever sent to either. #}
{% if CLARITY_ID %}<script>
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

</script>{% endif %}
{% if META_PIXEL_ID %}<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};

  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '{{ META_PIXEL_ID|escapejs }}');
  fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id={{ META_PIXEL_ID|urlencode }}&amp;ev=PageView&amp;noscript=1"></noscript>{% endif %}

{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WikiScholar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@100..112.5,400..800&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/public.css' %}">
  {% block head %}{% endblock %}
  <link rel="icon" type="image/png" href="{% static 'img/wikischolar-logo.png' %}">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      {# width/height keep the logo small even before the stylesheet loads #}
      <a class="brand" href="/"><img src="{% static 'img/wikischolar-logo.png' %}" alt="WikiScholar" width="143" height="44"></a>
      <nav class="site-links" aria-label="WikiScholar website">
        <span class="org">A Wikimedia Bangladesh programme</span>
        <a class="back-site" href="{{ SITE_URL }}"><span aria-hidden="true">&larr;</span> <span class="back-long">Back to </span>{{ SITE_HOST }}</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
